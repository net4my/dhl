name: Build GeoGuard APK

# Baut die installierbare .apk in der Cloud (GitHub-Runner haben das Android-SDK)
# und stellt sie als Download-Artefakt bereit. Bei einem Tag v* wird zusätzlich
# ein Release mit angehängter APK erstellt.

on:
  push:
    branches: [ "**" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed Release APK
        run: |
          n=0
          until [ $n -ge 5 ]; do
            ./gradlew --no-daemon assembleRelease && exit 0
            n=$((n+1))
            echo "::warning::Gradle build attempt $n failed (likely a transient download error), retrying in 15s…"
            sleep 15
          done
          echo "::error::Gradle build failed after 5 attempts"
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GeoGuard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoGuard-apk
          path: android/GeoGuard.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        if: github.ref == 'refs/heads/claude/local-gps-apk-app-LKd13' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: GeoGuard v1.3
          body: |
            GeoGuard – GPS, Kompass, Karte, Navigation, GNSS & mehr.
            Lade unten **GeoGuard.apk** herunter und installiere sie auf deinem Android-Gerät.

            Neu in v1.3: Offline-Karten (Kacheln herunterladen), Touren-Verlauf mit
            Höhenprofil & GPX-Import, Trip-Computer, UTM/MGRS/Plus-Code, echter Norden
            (Missweisungs-Korrektur), Sonne/Mond, QR-Code, Ankunfts-Alarm, Sprach-Hinweise,
            Rotlicht-Nachtmodus und Tacho-HUD.

            Hinweis: Falls eine v1.0/v1.1 installiert ist, diese **einmal deinstallieren**
            (ab v1.2 funktionieren Updates dank festem Signaturschlüssel normal).
          files: android/GeoGuard.apk
