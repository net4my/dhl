name: Build GeoGuard APK

# Baut die installierbare .apk in der Cloud (GitHub-Runner haben das Android-SDK)
# und stellt sie als Download-Artefakt bereit. Bei einem Tag v* wird zusätzlich
# ein Release mit angehängter APK erstellt.

on:
  push:
    branches: [ "**" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed Release APK
        run: |
          n=0
          until [ $n -ge 5 ]; do
            ./gradlew --no-daemon assembleRelease && exit 0
            n=$((n+1))
            echo "::warning::Gradle build attempt $n failed (likely a transient download error), retrying in 15s…"
            sleep 15
          done
          echo "::error::Gradle build failed after 5 attempts"
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GeoPilot.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoPilot-apk
          path: android/GeoPilot.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        if: github.ref == 'refs/heads/claude/local-gps-apk-app-LKd13' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.7
          name: GeoPilot v3.7
          body: |
            GeoPilot 3.7 – neu aufgebaute, logische Navigation.
            Lade unten **GeoPilot.apk** herunter und installiere sie auf deinem Android-Gerät.

            • **Klarer Ablauf:** „Wohin?“-Suche ganz oben, dann Ziel & Route, Optionen
              und Wegpunkte sauber getrennt und in klappbaren Karten geordnet.
            • **Schnellziele & Verlauf:** 🏠 Zuhause und 💼 Arbeit als Favoriten plus eine
              Liste der zuletzt gesuchten Ziele – ein Tipp und das Ziel ist gesetzt.
            • **In der Nähe:** Umkreissuche nach Tankstelle, Parken, Restaurant, Café,
              Supermarkt, Geldautomat, Apotheke oder Hotel – sortiert nach Entfernung.
            • **Bessere Live-Führung:** aktuelle Geschwindigkeit jetzt im Navi-Banner
              neben Ankunftszeit und Reststrecke.
          files: android/GeoPilot.apk
